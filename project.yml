# XcodeGen spec for Bubbleg.xcodeproj, the project for archiving and distributing the app.
# After adding or removing files, regenerate it: `xcodegen` in this folder.
# Package.swift and build.sh stay for quick command-line builds of the same sources.
name: Bubbleg
options:
  bundleIdPrefix: com.yaric
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    DEVELOPMENT_TEAM: 6J57A4298A
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  Bubbleg:
    type: application
    platform: macOS
    sources:
      - path: Sources/Bubbleg
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Bubbleg
        PRODUCT_BUNDLE_IDENTIFIER: com.yaric.bubbleg
        # Info.plist carries the version (CFBundleShortVersionString, CFBundleVersion).
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        # The Developer ID build stays unsandboxed: it keeps Hide Desktop Files (Finder's preferences)
        # and the exact window lookup (a private call). BubblegAppStore below is the sandboxed one.
        ENABLE_APP_SANDBOX: NO
        # Notarization requires the hardened runtime.
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
  # The Mac App Store build: the same sources and bundle ID, sandboxed, compiled with APP_STORE, which
  # swaps the private window lookup for a public one, drops Hide Desktop Files and makes launch at login opt-in.
  BubblegAppStore:
    type: application
    platform: macOS
    sources:
      - path: Sources/Bubbleg
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Bubbleg
        PRODUCT_BUNDLE_IDENTIFIER: com.yaric.bubbleg
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: AppStore/Bubbleg.entitlements
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) APP_STORE
schemes:
  Bubbleg:
    build:
      targets:
        Bubbleg: all
    run:
      config: Debug
    archive:
      config: Release
  Bubbleg App Store:
    build:
      targets:
        BubblegAppStore: all
    run:
      config: Debug
    archive:
      config: Release
