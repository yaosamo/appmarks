<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Appmarks</title>
  <meta name="description" content="A personal Stage Manager for your Mac." />
  <link rel="icon" href="../icon.svg" type="image/svg+xml" />
  <style>
    /* Option B — Glow: the video centered, lit by its own colors; name and button below. */
    :root {
      --ground: #0B0C10;
      --ink: #F4F5F7;
      --quiet: rgba(244, 245, 247, 0.55);
      --line: rgba(255, 255, 255, 0.12);
      --mark: #F2B33D;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: var(--ground);
      color: var(--ink);
      font: 15px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    .page {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(24px, 4vh, 44px);
      height: 100svh;
      padding: clamp(24px, 5vh, 64px) clamp(16px, 5vw, 72px);
    }

    .stage {
      flex: 1;
      min-height: 0;
      width: 100%;
      container-type: size;
      display: grid;
      place-items: center;
    }
    .screen {
      position: relative;
      width: min(100cqw, calc(100cqh * 16 / 9), 1440px);
      aspect-ratio: 16 / 9;
    }
    /* A 32×18 copy of the current frame, blown up and blurred into a halo. */
    .glow {
      position: absolute;
      inset: -6%;
      width: 112%;
      height: 112%;
      filter: blur(70px) saturate(1.5);
      opacity: 0.55;
      pointer-events: none;
    }
    .frame {
      position: relative;
      height: 100%;
      border-radius: 16px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 0 0 1px var(--line), 0 40px 80px -30px rgba(0, 0, 0, 0.8);
    }
    .frame video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .intro {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 6px;
    }
    .title { display: flex; align-items: center; gap: 12px; }
    .title img { width: 40px; height: 40px; }
    h1 {
      font: 700 30px/1 -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", sans-serif;
      letter-spacing: -0.025em;
      margin: 0;
    }
    .lede { color: var(--quiet); font-size: 17px; margin: 0 0 14px; }
    .get {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 12px 20px 12px 16px;
      border-radius: 12px;
      background: #fff;
      color: #000;
      font-weight: 600;
      text-decoration: none;
    }
    .get svg { width: 18px; height: 18px; }
    .get:hover { background: #E6E8EC; }
    .fine { color: var(--quiet); font-size: 13px; margin: 6px 0 0; }
    a:focus-visible, button:focus-visible { outline: 2px solid var(--mark); outline-offset: 3px; }

    .sound {
      position: absolute;
      right: 14px;
      bottom: 14px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 12px 7px 10px;
      border: 0;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.55);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      color: #fff;
      font-size: 13px;
      font-weight: 500;
      line-height: 1;
      font-family: inherit;
      cursor: pointer;
    }
    .sound svg { width: 16px; height: 16px; }
    .screen.muted video { cursor: pointer; }
    .screen:not(.muted) .sound { display: none; }

    @media (max-width: 700px) {
      .page { height: auto; padding: 40px 16px 48px; gap: 36px; }
      .stage { flex: none; container-type: normal; }
      .screen { width: 100%; }
      .frame { border-radius: 10px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .glow { display: none; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="stage" aria-label="Demo">
      <div class="screen muted" id="screen">
        <canvas class="glow" id="glow" width="32" height="18" aria-hidden="true"></canvas>
        <div class="frame">
          <video id="demo" autoplay muted loop playsinline preload="auto" poster="../demo-poster.jpg" aria-label="Appmarks parking and bringing back windows">
            <source src="../demo-av1.mp4" type='video/mp4; codecs="av01.0.09M.10"' />
            <source src="../demo.mp4" type="video/mp4" />
          </video>
          <button class="sound" id="sound" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="m22 9-6 6"/><path d="m16 9 6 6"/></svg>
            Click for sound
          </button>
        </div>
      </div>
    </section>

    <section class="intro">
      <div class="title">
        <img src="../icon.svg" alt="" width="40" height="40" />
        <h1>Appmarks</h1>
      </div>
      <p class="lede">A personal Stage Manager for your Mac.</p>
      <a class="get" href="/download">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v12"/><path d="m6 11 6 6 6-6"/><path d="M5 20h14"/></svg>
        Download for Mac
      </a>
      <p class="fine">Free. Needs macOS 14 or later.</p>
    </section>
  </main>
  <script>
    const screen = document.getElementById("screen");
    const demo = document.getElementById("demo");

    // A click on the muted video (or the hint) turns sound on and hands over to the native controls.
    function listen(event) {
      if (!screen.classList.contains("muted")) return;
      event.preventDefault();
      screen.classList.remove("muted");
      demo.muted = false;
      demo.controls = true;
      demo.play();
    }
    demo.addEventListener("click", listen);
    document.getElementById("sound").addEventListener("click", listen);

    // Repaint the halo from the video a few times a second; it only needs the rough colors.
    const glow = document.getElementById("glow").getContext("2d");
    const poster = new Image();
    poster.onload = () => glow.drawImage(poster, 0, 0, 32, 18);
    poster.src = demo.poster;
    setInterval(() => {
      if (demo.readyState >= 2 && !demo.paused) glow.drawImage(demo, 0, 0, 32, 18);
    }, 150);
  </script>
</body>
</html>
