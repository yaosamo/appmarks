<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Appmarks</title>
  <meta name="description" content="A personal Stage Manager for your Mac." />
  <link rel="icon" href="../icon.svg" type="image/svg+xml" />
  <style>
    /* Option C — Masthead: a slim header that holds the download, one line, then the video. */
    :root {
      --ground: #F4F5F7;
      --ink: #15171C;
      --quiet: #6B7280;
      --line: rgba(21, 23, 28, 0.1);
      --button: #15171C;
      --button-ink: #fff;
      --mark: #F2B33D;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ground: #101216;
        --ink: #ECEEF2;
        --quiet: #8E95A3;
        --line: rgba(236, 238, 242, 0.12);
        --button: #ECEEF2;
        --button-ink: #101216;
        color-scheme: dark;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      background: var(--ground);
      color: var(--ink);
      font: 15px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      display: flex;
      flex-direction: column;
      height: 100svh;
      padding: 0 clamp(16px, 4vw, 56px) clamp(16px, 4vh, 48px);
    }

    header {
      display: flex;
      align-items: center;
      gap: 10px;
      height: 68px;
      flex: none;
    }
    header img { width: 28px; height: 28px; }
    header strong { font-size: 16px; font-weight: 650; letter-spacing: -0.01em; }
    .spacer { flex: 1; }
    .fine { color: var(--quiet); font-size: 13px; margin: 0 6px 0 0; }
    .get {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 15px 9px 12px;
      border-radius: 9px;
      background: var(--button);
      color: var(--button-ink);
      font-weight: 600;
      font-size: 14px;
      text-decoration: none;
      white-space: nowrap;
    }
    .get svg { width: 16px; height: 16px; }
    .get:hover { opacity: 0.86; }
    a:focus-visible, button:focus-visible { outline: 2px solid var(--mark); outline-offset: 3px; }

    h1 {
      font: 700 clamp(28px, 3.6vw, 44px)/1.05 -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", sans-serif;
      letter-spacing: -0.03em;
      text-align: center;
      text-wrap: balance;
      margin: clamp(12px, 3vh, 36px) 0 clamp(20px, 4vh, 44px);
    }
    h1 span { color: var(--quiet); }

    .stage {
      flex: 1;
      min-height: 0;
      container-type: size;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    .screen {
      position: relative;
      width: min(100cqw, calc(100cqh * 16 / 9), 1600px);
      aspect-ratio: 16 / 9;
      border-radius: 14px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 0 0 1px var(--line), 0 30px 70px -28px rgba(10, 14, 22, 0.45);
    }
    .screen video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .sound {
      position: absolute;
      right: 14px;
      bottom: 14px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 12px 7px 10px;
      border: 0;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.55);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      color: #fff;
      font-size: 13px;
      font-weight: 500;
      line-height: 1;
      font-family: inherit;
      cursor: pointer;
    }
    .sound svg { width: 16px; height: 16px; }
    .screen.muted video { cursor: pointer; }
    .screen:not(.muted) .sound { display: none; }

    @media (max-width: 700px) {
      .page { height: auto; padding-bottom: 48px; }
      .fine { display: none; }
      .stage { flex: none; container-type: normal; }
      .screen { width: 100%; border-radius: 10px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <img src="../icon.svg" alt="" width="28" height="28" />
      <strong>Appmarks</strong>
      <div class="spacer"></div>
      <p class="fine">Free · macOS 14+</p>
      <a class="get" href="/download">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v12"/><path d="m6 11 6 6 6-6"/><path d="M5 20h14"/></svg>
        Download
      </a>
    </header>

    <h1>A personal Stage Manager <span>for your Mac.</span></h1>

    <section class="stage" aria-label="Demo">
      <div class="screen muted" id="screen">
        <video id="demo" autoplay muted loop playsinline preload="auto" poster="../demo-poster.jpg" aria-label="Appmarks parking and bringing back windows">
          <source src="../demo-av1.mp4" type='video/mp4; codecs="av01.0.09M.10"' />
          <source src="../demo.mp4" type="video/mp4" />
        </video>
        <button class="sound" id="sound" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="m22 9-6 6"/><path d="m16 9 6 6"/></svg>
          Click for sound
        </button>
      </div>
    </section>
  </main>
  <script>
    // A click on the muted video (or the hint) turns sound on and hands over to the native controls.
    const screen = document.getElementById("screen");
    const demo = document.getElementById("demo");
    function listen(event) {
      if (!screen.classList.contains("muted")) return;
      event.preventDefault();
      screen.classList.remove("muted");
      demo.muted = false;
      demo.controls = true;
      demo.play();
    }
    demo.addEventListener("click", listen);
    document.getElementById("sound").addEventListener("click", listen);
  </script>
</body>
</html>
