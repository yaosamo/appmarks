<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Appmarks</title>
  <meta name="description" content="A personal Stage Manager for your Mac. Windows you're not using wait as thumbnails at the edge of the screen." />
  <meta property="og:title" content="Appmarks" />
  <meta property="og:description" content="A personal Stage Manager for your Mac." />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:creator" content="@yaosamo" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <style>
    :root {
      --ground: #E8EBF0;
      --ink: #191C22;
      --quiet: #5E6573;
      --line: rgba(25, 28, 34, 0.12);
      --key: #FFFFFF;
      --key-edge: rgba(25, 28, 34, 0.18);
      --stage: #D9DEE6;
      --window: #FFFFFF;
      --parked: #FFFFFF;
      --mark: #F2B33D;
      --button: #191C22;
      --button-ink: #FFFFFF;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --ground: #14171D;
        --ink: #ECEEF2;
        --quiet: #9199A8;
        --line: rgba(236, 238, 242, 0.12);
        --key: #232731;
        --key-edge: rgba(236, 238, 242, 0.16);
        --stage: #1E222B;
        --window: #343A47;
        --parked: #343A47;
        --button: #ECEEF2;
        --button-ink: #14171D;
        color-scheme: dark;
      }
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100svh;
      background: var(--ground);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, sans-serif;
      font-size: 15px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* One centered column: what it is and the download on top, the demo filling the rest. */
    .page {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(20px, 3.5vh, 40px);
      height: 100svh;
      padding: clamp(24px, 4.5vh, 56px) clamp(16px, 4vw, 56px);
    }

    .intro {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      max-width: 40rem;
    }
    .icon {
      width: 72px;
      height: 72px;
      margin: 0 0 14px;
      filter: drop-shadow(0 10px 18px rgba(21, 26, 36, 0.28));
    }
    h1 {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", sans-serif;
      font-size: 40px;
      line-height: 1.05;
      font-weight: 700;
      letter-spacing: -0.025em;
      margin: 0 0 8px;
    }
    .lede {
      text-wrap: balance;
      font-size: 19px;
      line-height: 1.35;
      font-weight: 500;
      letter-spacing: -0.01em;
      margin: 0 0 6px;
    }
    .about {
      text-wrap: balance;
      color: var(--quiet);
      margin: 0 0 22px;
      max-width: 34em;
    }

    .actions {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .get {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 11px 18px 11px 15px;
      border-radius: 10px;
      background: var(--button);
      color: var(--button-ink);
      font-weight: 600;
      text-decoration: none;
    }
    .get svg { width: 18px; height: 18px; }
    .get:hover { opacity: 0.88; }
    .get:focus-visible, a:focus-visible {
      outline: 2px solid var(--mark);
      outline-offset: 3px;
    }
    .fine {
      color: var(--quiet);
      font-size: 13px;
      margin: 0;
    }

    /* Stage: the video, as large as the space left over allows. */
    .stage {
      flex: 1;
      min-height: 0;
      width: 100%;
      container-type: size;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    .screen {
      position: relative;
      width: min(100cqw, calc(100cqh * 16 / 9), 1440px);
      aspect-ratio: 16 / 9;
      border-radius: 14px;
      overflow: hidden;
      background: var(--stage);
      box-shadow: 0 0 0 1px var(--line), 0 30px 60px -20px rgba(21, 26, 36, 0.35);
    }
    .screen video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }
    .screen.has-video video { display: block; }
    .screen.has-video .sketch { display: none; }

    /* Browsers only autoplay muted video. Clicking it turns sound and the controls on. */
    .screen.muted video { cursor: pointer; }
    .sound {
      position: absolute;
      right: 14px;
      bottom: 14px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 12px 7px 10px;
      border: 0;
      border-radius: 999px;
      background: rgba(20, 23, 29, 0.62);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      color: #fff;
      font: 500 13px/1 -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      cursor: pointer;
    }
    .sound:hover { background: rgba(20, 23, 29, 0.78); }
    .sound:focus-visible { outline: 2px solid var(--mark); outline-offset: 3px; }
    .sound svg { width: 16px; height: 16px; }
    .screen:not(.has-video) .sound, .screen:not(.muted) .sound { display: none; }

    /* Until the demo is recorded: a drawing of what it does. */
    .sketch { position: absolute; inset: 0; }
    .sketch .window {
      position: absolute;
      left: 16%; top: 16%;
      width: 58%; height: 64%;
      border-radius: 2.2% / 3.4%;
      background: var(--window);
      box-shadow: 0 0 0 1px var(--line), 0 18px 40px -18px rgba(21, 26, 36, 0.4);
    }
    .sketch .window::before {
      content: "";
      position: absolute;
      left: 0; right: 0; top: 0;
      height: 11%;
      border-bottom: 1px solid var(--line);
    }
    .sketch .window::after {
      content: "";
      position: absolute;
      right: 9%; top: -3%;
      width: 6%; height: 30%;
      background: var(--mark);
      clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 82%, 0 100%);
    }
    .sketch .parked {
      position: absolute;
      right: 4%;
      width: 12%;
      aspect-ratio: 16 / 11;
      border-radius: 6px;
      background: var(--parked);
      box-shadow: 0 0 0 1px var(--line);
      opacity: 0.7;
      animation: park 700ms cubic-bezier(.2, .8, .2, 1) both;
    }
    .sketch .parked:nth-child(2) { top: 24%; animation-delay: 300ms; }
    .sketch .parked:nth-child(3) { top: 39%; animation-delay: 380ms; }
    .sketch .parked:nth-child(4) { top: 54%; animation-delay: 460ms; }
    .sketch .parked:nth-child(5) { top: 69%; animation-delay: 540ms; }
    @keyframes park {
      from { transform: translateX(-180%) scale(1.6); opacity: 0; }
      to { transform: none; opacity: 0.7; }
    }
    .sketch p {
      position: absolute;
      left: 0; right: 0; bottom: 5%;
      margin: 0;
      text-align: center;
      font-size: 13px;
      color: var(--quiet);
    }
    @media (prefers-reduced-motion: reduce) {
      .sketch .parked { animation: none; }
    }

    /* Phones: a normal scrolling column; the video takes the full width. */
    @media (max-width: 700px) {
      .page { height: auto; gap: 32px; padding: 40px 16px 48px; }
      .stage { flex: none; container-type: normal; }
      .screen { width: 100%; }
      h1 { font-size: 36px; }
    }
    /* Short laptop screens: keep the video big by dropping the explanation. */
    @media (max-height: 680px) and (min-width: 701px) {
      .about { display: none; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="intro">
      <img class="icon" src="icon.svg" alt="" width="72" height="72" />
      <h1>Appmarks</h1>
      <p class="lede">A personal Stage Manager for your&nbsp;Mac.</p>
      <p class="about">Windows you're not using wait as thumbnails at the edge of the screen. The others on stage show up as small appmarks pinned to the one you're in.</p>

      <div class="actions">
        <a class="get" href="/download">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v12"/><path d="m6 11 6 6 6-6"/><path d="M5 20h14"/></svg>
          Download for Mac
        </a>
        <p class="fine">Free. Needs macOS 14 or later.</p>
      </div>
    </section>

    <section class="stage" aria-label="Demo">
      <div class="screen has-video muted" id="screen">
        <video id="demo" autoplay muted loop playsinline preload="auto" poster="demo-poster.jpg" aria-label="Appmarks parking and bringing back windows">
          <source src="demo-av1.mp4" type='video/mp4; codecs="av01.0.09M.10"' />
          <source src="demo.mp4" type="video/mp4" />
        </video>
        <button class="sound" id="sound" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="m22 9-6 6"/><path d="m16 9 6 6"/></svg>
          Click for sound
        </button>
        <div class="sketch" aria-hidden="true">
          <div class="window"></div>
          <div class="parked"></div>
          <div class="parked"></div>
          <div class="parked"></div>
          <div class="parked"></div>
        </div>
      </div>
    </section>
  </main>
  <script>
    // The browser takes the AV1 file when it can decode it, else the H.264 one. If neither
    // plays, the last source errors and the sketch takes the video's place.
    const screen = document.getElementById("screen");
    document.querySelector("#demo source:last-of-type")
      .addEventListener("error", () => screen.classList.remove("has-video"));

    // A click on the muted video (or the hint) turns sound on and hands over to the native
    // controls, so it can be paused and scrubbed from then on.
    const demo = document.getElementById("demo");
    function listen(event) {
      if (!screen.classList.contains("muted")) return;
      event.preventDefault();
      screen.classList.remove("muted");
      demo.muted = false;
      demo.controls = true;
      demo.play();
    }
    demo.addEventListener("click", listen);
    document.getElementById("sound").addEventListener("click", listen);
  </script>
</body>
</html>
