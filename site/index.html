    /* Bubble gum, like the icon: a jelly pink pill with a crisp rim, a gloss across its top

    /* The gloss: bright at the rim, fading out before the middle. */

    /* Until the demo is recorded: a drawing of what it does. */
    .sketch { position: absolute; inset: 0; }
    .sketch .window {
      position: absolute;
      left: 16%; top: 16%;
      width: 58%; height: 64%;
      border-radius: 2.2% / 3.4%;
      background: var(--window);
      box-shadow: 0 0 0 1px var(--line), 0 18px 40px -18px rgba(21, 26, 36, 0.4);
    }
    .sketch .window::before {
      content: "";
      position: absolute;
      left: 0; right: 0; top: 0;
      height: 11%;
      border-bottom: 1px solid var(--line);
    }
    .sketch .window::after {
      content: "";
      position: absolute;
      right: 9%; top: -3%;
      width: 6%; height: 30%;
      background: var(--mark);
      clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 82%, 0 100%);

    .sketch .parked {
      position: absolute;
      right: 4%;
      width: 12%;
      aspect-ratio: 16 / 11;
      border-radius: 6px;
      background: var(--parked);
      box-shadow: 0 0 0 1px var(--line);
      opacity: 0.7;
      animation: park 700ms cubic-bezier(.2, .8, .2, 1) both;
    }
    .sketch .parked:nth-child(2) { top: 24%; animation-delay: 300ms; }
    .sketch .parked:nth-child(3) { top: 39%; animation-delay: 380ms; }
    .sketch .parked:nth-child(4) { top: 54%; animation-delay: 460ms; }
    .sketch .parked:nth-child(5) { top: 69%; animation-delay: 540ms; }
    @keyframes park {
      from { transform: translateX(-180%) scale(1.6); opacity: 0; }
      to { transform: none; opacity: 0.7; }
    }
    .sketch p {

    }
    @media (prefers-reduced-motion: reduce) {
      .sketch .parked { animation: none; }
    }

    /* Chapters: a row of pills under the video; the one playing is tinted. */
    .chapters {

    /* Bubbleg to play with: the app's floating panel, sized as the app draws it (32px tall
       previews 6px apart, a 5px backdrop, an 80px square on hover). Script places it. */
    .bubbles {
      position: fixed;
      left: 0;
      top: 0;
      z-index: 10;
      box-sizing: border-box;
      display: flex;
      justify-content: center;
      gap: 6px;
      padding: 5px;
      border-radius: 9px;
      background: rgba(255, 255, 255, 0.72);
      -webkit-backdrop-filter: blur(20px) saturate(1.6);
      backdrop-filter: blur(20px) saturate(1.6);
      box-shadow: 0 0 0 1px rgba(25, 28, 34, 0.08), 0 8px 24px rgba(25, 28, 34, 0.14);
      cursor: grab;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    .bubbles.vertical { flex-direction: column; }
    .bubbles.grow-end { align-items: flex-start; }
    .bubbles.grow-start { align-items: flex-end; }

    /* With the pointer inside, the panel opens once to the room a bubble grown to the 80px
       square needs, and holds that shape until the pointer leaves; inside it, the bubble under
       the pointer grows and the others slide aside. Script sets the sizes and the .hovered one. */
    .bubbles {
      transition: width 0.24s cubic-bezier(0.2, 0.8, 0.2, 1), height 0.24s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .bubbles.gliding {
      transition: left 0.12s ease-out, top 0.12s ease-out,

    .bubble.focused { outline: 2px solid #F2409D; outline-offset: -2px; }
    .bubble.hovered {

    /* First visit: "drag this thing", with an arrow at the panel. Script places it beside

    @media (prefers-reduced-motion: reduce) {

    @media (max-width: 700px) {

  <script>
    // The browser takes the AV1 file when it can decode it, else the H.264 one. If neither
    // plays, the last source errors and the sketch takes the video's place.
    const screen = document.getElementById("screen");
    document.querySelector("#demo source:last-of-type")
      .addEventListener("error", () => screen.classList.remove("has-video"));

    // A click on the muted video (or the hint) turns sound on and hands over to the native
    // controls, so it can be paused and scrubbed from then on. Sound starts at 30%, since the
    // voice is mastered loud; the controls' slider takes it from there. iOS ignores `volume`.
    const demo = document.getElementById("demo");
    demo.volume = 0.3;
    function listen(event) {
      if (!screen.classList.contains("muted")) return;
      event.preventDefault();
      screen.classList.remove("muted");
      demo.muted = false;
      demo.controls = true;
      demo.play();
    }
    demo.addEventListener("click", listen);
    document.getElementById("sound").addEventListener("click", listen);

    // Chapters jump the video and keep it playing, muted or not; the one playing is marked.
    const chapters = [...document.querySelectorAll(".chapters button")];
    for (const button of chapters) {
      button.addEventListener("click", () => {
        demo.currentTime = Number(button.dataset.start);
        demo.play();
      });
    }
    demo.addEventListener("timeupdate", () => {
      const current = chapters.findLast(button => demo.currentTime >= Number(button.dataset.start));
      for (const button of chapters) button.setAttribute("aria-current", String(button === current));
    });

    // A link like #t=121 (what search results use for the chapters) starts the video there.
    const startAt = () => {
      const seconds = Number(location.hash.match(/^#t=(\d+)$/)?.[1]);
      if (seconds) demo.currentTime = seconds;
    };
    startAt();
    window.addEventListener("hashchange", startAt);

    // Bubbleg to play with, by the app's own rules (Widget.swift): drag the panel anywhere; it
    // clicks onto the viewport's corners and edge middles, and onto a side of the video, which it
    // then slides along, and comes free once pulled 64px away. Near a left or right edge it turns
    // into a column, near the top or bottom into a row. Clicking a bubble only moves the ring.
    (() => {
      const panel = document.getElementById("bubbles");
      let hint = document.getElementById("drag-hint");
      if (matchMedia("(max-width: 700px), (hover: none)").matches) return panel.remove(), hint.remove();
      try { if (localStorage.getItem("bubbleg-dragged")) hint = hint.remove(); } catch {}
      const items = [...panel.children];
      const widths = items.map(item => parseFloat(item.style.getPropertyValue("--w")));
      const HEIGHT = 32, SPACING = 6, PADDING = 5;
      const MARGIN = 16, POINT_REACH = 40, EDGE_REACH = 24, TURN_REACH = 120, RELEASE = 64, WINDOW_GAP = 8;
      const SPOTS = {
        topLeft: [0, 0], top: [0.5, 0], topRight: [1, 0], right: [1, 0.5],
        bottomRight: [1, 1], bottom: [0.5, 1], bottomLeft: [0, 1], left: [0, 0.5],
      };
      const SIDES = ["top", "right", "bottom", "left"];
      let anchor = { type: "window", side: "left", offset: 0.5 };
      let vertical = true;
      let placed = null;
      let mode = "";
      let drag = null;
      let open = false;
      let hovered = null;
      const GROWN = 80;

      // The shape while the pointer is inside: room across for the 80px square, and along for
      // the one bubble that grows the most, so moving between bubbles never resizes it.
      function openSize(isVertical) {
        const rest = bodySize(isVertical);
        const growth = isVertical ? GROWN - HEIGHT : Math.max(...widths.map(w => Math.max(GROWN - w, 0)));
        return isVertical ? { w: GROWN + 2 * PADDING, h: rest.h + growth } : { w: rest.w + growth, h: GROWN + 2 * PADDING };
      }

      // The hint sits above the panel (below it near the top), off toward the middle of the
      // screen, its arrow ending just short of the panel's edge. The drawing points down and
      // to the left; it flips to point the other ways.
      function placeHint() {
        if (!hint) return;
        const r = panel.getBoundingClientRect();
        const [label, arrow] = hint.children;
        const right = r.left + r.width / 2 < innerWidth / 2;
        const above = r.top > 120;
        const endX = r.left + r.width / 2, endY = above ? r.top - 6 : r.bottom + 6;
        const x = right ? endX - 10 : endX - 74, y = above ? endY - 56 : endY - 8;
        arrow.style.transform = `translate(${x}px, ${y}px) scale(${right ? 1 : -1}, ${above ? 1 : -1})`;
        const lw = label.offsetWidth, lh = label.offsetHeight;
        const lx = right ? x + 78 : x + 6 - lw, ly = (above ? y + 6 : y + 58) - lh / 2;
        label.style.transform = `translate(${lx}px, ${ly}px)`;
      }
      function dismissHint() {
        if (!hint) return;
        hint.remove();
        hint = null;
        try { localStorage.setItem("bubbleg-dragged", "1"); } catch {}
      }

      function setOpen(next) {
        if (open === next) return;
        open = next;
        hint?.classList.toggle("away", open);
        if (!open) setHovered(null);
        apply(resolve(anchor), false);
      }

      function setHovered(item) {
        if (hovered === item) return;
        hovered?.classList.remove("hovered");
        hovered = item;
        hovered?.classList.add("hovered");
      }

      // The bubble nearest the pointer along the stack, so the gaps between them belong to the
      // nearer one and crossing a gap doesn't shrink and regrow anything.
      function nearestItem(event) {
        const at = vertical ? event.clientY : event.clientX;
        let best = null, bestDistance = Infinity;
        for (const item of items) {
          const r = item.getBoundingClientRect();
          const [start, end] = vertical ? [r.top, r.bottom] : [r.left, r.right];
          const d = Math.max(start - at, 0, at - end);
          if (d < bestDistance) { best = item; bestDistance = d; }
        }
        return best;
      }

      const clamp = (v, lo, hi) => Math.min(Math.max(v, lo), hi);
      const viewport = () => ({ x: 0, y: 0, w: innerWidth, h: innerHeight });
      const video = () => {
        const r = document.getElementById("screen").getBoundingClientRect();
        return { x: r.left, y: r.top, w: r.width, h: r.height };
      };

      // The resting bubbles and their backdrop: what snaps, as opposed to room to grow on hover.
      function bodySize(isVertical) {
        const along = isVertical ? items.length * HEIGHT : widths.reduce((a, b) => a + b, 0);
        const length = along + SPACING * (items.length - 1) + 2 * PADDING;
        const across = (isVertical ? Math.max(...widths) : HEIGHT) + 2 * PADDING;
        return isVertical ? { w: across, h: length } : { w: length, h: across };
      }

      // A column on the left and right middles, a row on the top and bottom; a corner keeps either.
      const spotVertical = spot => SPOTS[spot][0] === 0.5 ? false : SPOTS[spot][1] === 0.5 ? true : vertical;
      const pointOf = spot => ({ x: innerWidth * SPOTS[spot][0], y: innerHeight * SPOTS[spot][1] });

      // Outside `side` of the video, `offset` of the way along it; inside, when there's no room out.
      function onVideo(side, offset) {
        const v = video(), isVertical = side === "left" || side === "right";
        const size = bodySize(isVertical), screen = viewport();
        const [start, length, own] = isVertical ? [v.y, v.h, size.h] : [v.x, v.w, size.w];
        let along = start + (length - own) * (own > length ? 0.5 : clamp(offset, 0, 1));
        along = clamp(along, 0, (isVertical ? screen.h : screen.w) - own);
        const before = side === "left" || side === "top";
        const [edgeMin, edgeMax, thickness] = isVertical ? [v.x, v.x + v.w, size.w] : [v.y, v.y + v.h, size.h];
        const outside = before ? edgeMin - WINDOW_GAP - thickness : edgeMax + WINDOW_GAP;
        const fits = outside >= 0 && outside + thickness <= (isVertical ? screen.w : screen.h);
        const across = fits ? outside : before ? edgeMin + WINDOW_GAP : edgeMax - WINDOW_GAP - thickness;
        const body = isVertical ? { x: across, y: along, ...size } : { x: along, y: across, ...size };
        // Hovered bubbles grow away from the video outside it, and into it when inside.
        return { body, vertical: isVertical, growStart: before === fits };
      }

      function resolve(a) {
        if (a.type === "screen") {
          const isVertical = spotVertical(a.spot), size = bodySize(isVertical), [ux, uy] = SPOTS[a.spot];
          const x = ux === 0 ? MARGIN : ux === 1 ? innerWidth - MARGIN - size.w : (innerWidth - size.w) / 2;
          const y = uy === 0 ? MARGIN : uy === 1 ? innerHeight - MARGIN - size.h : (innerHeight - size.h) / 2;
          return { body: { x, y, ...size }, vertical: isVertical, growStart: (isVertical ? ux : uy) === 1 };
        }
        if (a.type === "window") return onVideo(a.side, a.offset);
        const size = bodySize(a.vertical);
        const body = {
          x: clamp(a.x, 0, innerWidth - size.w), y: clamp(a.y, 0, innerHeight - size.h), ...size,
        };
        // Free, they grow toward the middle of the screen.
        const growStart = a.vertical ? body.x + body.w / 2 > innerWidth / 2 : body.y + body.h / 2 > innerHeight / 2;
        return { body, vertical: a.vertical, growStart };
      }

      // Pinned by the edge the bubbles grow away from, and centred along their length, so a
      // hovered one grows outward and both ways along the stack, as in the app.
      function apply(p, glide) {
        placed = p;
        vertical = p.vertical;
        const { x, y, w, h } = p.body;
        const size = open ? openSize(p.vertical) : { w, h };
        // Opened, the centre moves in just enough to keep the longer panel on screen.
        const centre = (start, length, room, opened) => clamp(start + length / 2, opened / 2, room - opened / 2);
        let left, top, tx, ty;
        if (p.vertical) {
          [left, tx] = p.growStart ? [x + w, "-100%"] : [x, "0"];
          [top, ty] = [centre(y, h, innerHeight, size.h), "-50%"];
        } else {
          [left, tx] = [centre(x, w, innerWidth, size.w), "-50%"];
          [top, ty] = p.growStart ? [y + h, "-100%"] : [y, "0"];
        }
        panel.style.width = `${size.w}px`;
        panel.style.height = `${size.h}px`;
        const next = `${p.vertical} ${p.growStart}`;
        panel.classList.toggle("gliding", glide && next === mode);
        mode = next;
        panel.classList.toggle("vertical", p.vertical);
        panel.classList.toggle("grow-start", p.growStart);
        panel.classList.toggle("grow-end", !p.growStart);
        panel.style.left = `${left}px`;
        panel.style.top = `${top}px`;
        panel.style.transform = `translate(${tx}, ${ty})`;
        placeHint();
      }

      // The bubbles under the pointer, as a row or a column, held where they were grabbed.
      function freeBody(pointer, isVertical) {
        const size = bodySize(isVertical);
        const [fx, fy] = isVertical ? [drag.across, drag.along] : [drag.along, drag.across];
        return { x: pointer.x - fx * size.w, y: pointer.y - fy * size.h, ...size };
      }

      const distance = (pt, r) =>
        Math.hypot(Math.max(r.x - pt.x, 0, pt.x - r.x - r.w), Math.max(r.y - pt.y, 0, pt.y - r.y - r.h));

      // How far along `side` of the video the bubbles would sit, if the pointer has them within reach.
      function sideOffset(pointer, side, reach) {
        const isVertical = side === "left" || side === "right";
        const body = freeBody(pointer, isVertical), snapped = onVideo(side, 0).body, v = video();
        const gap = isVertical ? Math.abs(body.x - snapped.x) : Math.abs(body.y - snapped.y);
        const overlaps = isVertical ? body.y + body.h > v.y && body.y < v.y + v.h
                                    : body.x + body.w > v.x && body.x < v.x + v.w;
        if (gap >= reach || !overlaps) return null;
        const [start, room] = isVertical ? [body.y - v.y, v.h - body.h] : [body.x - v.x, v.w - body.w];
        return room > 0 ? clamp(start / room, 0, 1) : 0.5;
      }

      // Near a viewport edge they turn to lie along it; in a corner, the shape they have wins a near tie.
      function facing(pointer) {
        const side = Math.min(pointer.x, innerWidth - pointer.x);
        const end = Math.min(pointer.y, innerHeight - pointer.y);
        if (Math.min(side, end) >= TURN_REACH) return null;
        return vertical ? side < end + 24 : side + 24 < end;
      }

      function target(pointer) {
        if (anchor.type === "screen" && distance(pointOf(anchor.spot), freeBody(pointer, spotVertical(anchor.spot))) < RELEASE) {
          return anchor;
        }
        if (anchor.type === "window") {
          const offset = sideOffset(pointer, anchor.side, RELEASE);
          if (offset !== null) return { type: "window", side: anchor.side, offset };
        }
        for (const spot in SPOTS) {
          if (distance(pointOf(spot), freeBody(pointer, spotVertical(spot))) < POINT_REACH) return { type: "screen", spot };
        }
        for (const side of SIDES) {
          const offset = sideOffset(pointer, side, EDGE_REACH);
          if (offset !== null) return { type: "window", side, offset };
        }
        const isVertical = facing(pointer) ?? vertical;
        const body = freeBody(pointer, isVertical);
        return { type: "free", x: body.x, y: body.y, vertical: isVertical };
      }

      const snapOf = a => a.type === "screen" ? `screen ${a.spot}` : a.type === "window" ? `video ${a.side}` : null;

      // The app's own click, decoded ahead so it plays the moment they snap. Browsers only start
      // audio after a gesture, so the context resumes on the first press.
      let audio, click;
      function prepareSound() {
        if (audio) return;
        audio = new AudioContext();
        fetch("click.wav").then(r => r.arrayBuffer()).then(data => audio.decodeAudioData(data))
          .then(buffer => { click = buffer; }).catch(() => {});
      }
      function playClick() {
        if (!click) return;
        const source = audio.createBufferSource(), gain = audio.createGain();
        source.buffer = click;
        gain.gain.value = 0.6;
        source.connect(gain).connect(audio.destination);
        source.start();
      }

      panel.addEventListener("pointerenter", () => {
        prepareSound();
        if (!drag) setOpen(true);
      });
      panel.addEventListener("pointerleave", () => {
        if (!drag) setOpen(false);
      });
      panel.addEventListener("pointerdown", event => {
        if (event.button !== 0) return;
        prepareSound();
        audio.resume();
        const { x, y, w, h } = placed.body;
        const along = vertical ? (event.clientY - y) / h : (event.clientX - x) / w;
        const across = vertical ? (event.clientX - x) / w : (event.clientY - y) / h;
        // Noted now: with the pointer captured, the release reports the panel, not the bubble.
        const item = event.target.closest(".bubble");
        drag = { startX: event.clientX, startY: event.clientY, along: clamp(along, 0, 1), across: clamp(across, 0, 1), item, moved: false };
        panel.setPointerCapture(event.pointerId);
      });
      panel.addEventListener("pointermove", event => {
        if (!drag) {
          if (open) setHovered(nearestItem(event));
          return;
        }
        if (!drag.moved && Math.hypot(event.clientX - drag.startX, event.clientY - drag.startY) < 3) return;
        if (!drag.moved) {
          // Dragged, the panel closes back to its resting shape, which is what snaps.
          drag.moved = true;
          dismissHint();
          panel.classList.add("dragging");
          setOpen(false);
        }
        const next = target({ x: event.clientX, y: event.clientY });
        const snap = snapOf(next);
        if (snap && snap !== snapOf(anchor)) playClick();
        anchor = next;
        apply(resolve(anchor), snap !== null);
      });
      function release(event) {
        if (!drag) return;
        // A click only moves the selection ring; no windows to open here.
        if (!drag.moved && drag.item) items.forEach(other => other.classList.toggle("focused", other === drag.item));
        const dragged = drag.moved;
        drag = null;
        panel.classList.remove("dragging");
        // Dropped with the pointer still on the bubbles, they open again under it.
        if (dragged) {
          const r = panel.getBoundingClientRect();
          const inside = event.clientX >= r.left && event.clientX <= r.right && event.clientY >= r.top && event.clientY <= r.bottom;
          setOpen(inside);
          if (inside) setHovered(nearestItem(event));
        }
      }
      panel.addEventListener("pointerup", release);
      panel.addEventListener("pointercancel", release);

      // Snapped to the video, they follow it as the page lays out, scrolls or resizes.
      const follow = () => apply(resolve(anchor), false);
      addEventListener("resize", follow);
      addEventListener("scroll", follow, { passive: true });
      new ResizeObserver(follow).observe(document.getElementById("screen"));
      follow();
    })();
  </script>
</body>
</html>
